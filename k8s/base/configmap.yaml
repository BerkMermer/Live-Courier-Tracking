apiVersion: v1
kind: ConfigMap
metadata:
  name: courier-config
data:
  POSTGRES_DB: courier_tracking
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_STOMP_PORT: "61613"

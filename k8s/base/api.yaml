apiVersion: v1
kind: Service
metadata:
  name: courier-api
  labels:
    app.kubernetes.io/name: courier-api
spec:
  selector:
    app.kubernetes.io/name: courier-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: courier-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: courier-api
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-redis
          image: busybox:1.36
          command: ["sh","-c","until nc -z redis 6379; do sleep 2; done"]
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ["sh","-c","until nc -z rabbitmq 61613; do sleep 2; done"]
      containers:
        - name: api
          image: courier-tracking-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: courier-config
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: courier-secrets
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: courier-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: courier-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: courier-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: courier-secrets
                  key: RABBITMQ_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 40
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
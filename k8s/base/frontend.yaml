apiVersion: v1
kind: Service
metadata:
  name: courier-frontend
  labels:
    app.kubernetes.io/name: courier-frontend
spec:
  selector:
    app.kubernetes.io/name: courier-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: courier-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: courier-frontend
    spec:
      containers:
        - name: frontend
          image: courier-tracking-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
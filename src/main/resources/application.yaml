spring:
  application:
    name: courier-tracking-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/courier_tracking}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
    db:
      enabled: true

jwt:
  secret: ${JWT_SECRET:c2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5MzJieXRlcw==}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    # "*" + credentials tarayıcıda reddedilir; allowlist kullanın
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.mydomain.com,http://localhost:3000}

courier:
  nearby:
    limit: ${COURIER_NEARBY_LIMIT:20}

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  stomp-port: ${RABBITMQ_STOMP_PORT:61613}
  login: ${RABBITMQ_USER:guest}
  passcode: ${RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.berk.courier_tracking_api: INFO

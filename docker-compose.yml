# Tüm gizli değerleri (şifreler, JWT_SECRET) projenin kökünde bir .env
# dosyasında tutun ve .env'i .gitignore'a ekleyin. Docker Compose bu dosyayı
# otomatik okur; aşağıdaki ${VAR:-default} değerleri yalnızca .env yoksa
# devreye giren local-dev fallback'leridir.
services:
  postgres:
    image: postgres:16-alpine
    container_name: courier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-courier_tracking}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-courier_tracking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - courier-net

  redis:
    image: redis:7-alpine
    container_name: courier-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - courier-net

  # RabbitMQ STOMP plugin — WebSocketConfig enableStompBrokerRelay için
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: courier-rabbitmq
    restart: unless-stopped
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-courier}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-courier}"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_STOMP_PORT:-61613}:61613"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - courier-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courier-tracking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-courier_tracking}"
      DATABASE_USERNAME: "${POSTGRES_USER:-postgres}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_STOMP_PORT: "61613"
      RABBITMQ_USER: "${RABBITMQ_USER:-courier}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-courier}"
      JWT_SECRET: "${JWT_SECRET:-c2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5MzJieXRlcw==}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-86400000}"
      APP_PORT: "${APP_PORT:-8080}"
    networks:
      - courier-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courier-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - courier-net

networks:
  courier-net:
    driver: bridge

volumes:
  postgres_data:

server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://courier-api:8080; }
    location /ws-courier {
        proxy_pass http://courier-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /swagger-ui { proxy_pass http://courier-api:8080; }
    location /swagger-ui.html { proxy_pass http://courier-api:8080; }
    location /v3/api-docs { proxy_pass http://courier-api:8080; }
    location /actuator/health { proxy_pass http://courier-api:8080; }
}